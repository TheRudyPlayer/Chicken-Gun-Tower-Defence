<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chicken Gun Tower Defense</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Fredoka",sans-serif;

    background:url("https://i.postimg.cc/Nf5xyrP5/backgroundmainmenucgtd.png") center center/cover no-repeat;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

}

/* Degradado */

body::after{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        to top,
        rgba(0,0,0,.45),
        rgba(0,0,0,.15) 40%,
        rgba(0,0,0,0)
    );

}

/* Contenedor */

.menu{

    position:relative;

    z-index:2;

    width:380px;

    text-align:center;

}

/* Título */

h1{

    color:white;

    font-size:54px;

    line-height:58px;

    margin-bottom:55px;

    text-shadow:

    0 3px 5px rgba(0,0,0,.25),

    0 8px 18px rgba(0,0,0,.35);

}

/* Botones */

button{

    width:100%;

    padding:18px;

    margin:14px 0;

    font-size:28px;

    font-family:"Fredoka",sans-serif;

    color:white;

    cursor:pointer;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        180deg,
        #dca55a,
        #ba7133
    );

    border:4px solid #6e3d16;

    box-shadow:

    inset 0 2px 0 rgba(255,255,255,.35),

    0 6px 0 #6e3d16,

    0 12px 18px rgba(0,0,0,.25);

    transition:.15s;

}

button:hover{

    transform:scale(1.03);

    filter:brightness(1.08);

}

button:active{

    transform:translateY(6px);

    box-shadow:

    inset 0 2px 0 rgba(255,255,255,.35),

    0 2px 0 #6e3d16;

}

/* Versión */

.version{

    margin-top:35px;

    color:white;

    font-size:18px;

    letter-spacing:1px;

    opacity:.9;

    text-shadow:0 2px 6px rgba(0,0,0,.4);

}

</style>

</head>

<body>

<div class="menu">

<h1>
Chicken Gun<br>
Tower Defense
</h1>

<button onclick="play()">
Jugar
</button>

<button onclick="settings()">
Ajustes
</button>

<button onclick="credits()">
Créditos
</button>

<div class="version">
Version 0.1
</div>

</div>

<script>

function play(){

    location.href="worldmap.html";

}

function settings(){

    alert("Próximamente");

}

function credits(){

    alert("Desarrollador: TheRudyPlayer");

}

</script>

</body>
</html>
