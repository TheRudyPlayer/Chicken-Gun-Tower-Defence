<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 1</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:#6dbb45;

    overflow:hidden;

}


/* HUD */

.hud{

    position:fixed;

    top:15px;

    left:15px;

    right:15px;

    display:flex;

    justify-content:center;

    gap:10px;

    z-index:20;

}


.box{

    background:#8b5a2b;

    color:white;

    padding:10px 15px;

    border-radius:15px;

    border:4px solid #4d280d;

    font-weight:bold;

}



/* Botones */

button{

    background:#dca55a;

    color:white;

    border:4px solid #5c3214;

    border-radius:15px;

    padding:10px;

    font-weight:bold;

    cursor:pointer;

}



/* Barra de vida */

.life-bar{

    position:fixed;

    top:70px;

    left:20px;

    width:250px;

    height:25px;

    background:#222;

    border:4px solid #4d280d;

    border-radius:20px;

    overflow:hidden;

}


#life-fill{

    width:100%;

    height:100%;

    background:red;

}



/* Mapa */

.game{

    width:100vw;

    height:100vh;

    position:relative;

}



/* Camino arriba-abajo */

.path{

    position:absolute;

    top:10%;

    left:50%;

    transform:translateX(-50%);

    width:90px;

    height:75%;

    background:#c99b63;

    border:10px solid #85552b;

    border-radius:50px;

    z-index:1;

}



/* Entrada */

.spawn{

    position:absolute;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    font-size:55px;

    z-index:10;

}

.spawn img{

width:80px;

height:80px;

object-fit:contain;

}

/* Bullet */
.bullet{

    position:absolute;

    width:12px;

    height:12px;

    border-radius:50%;

    background:yellow;

    z-index:100;

    pointer-events:none;

}



/* Base */

.base{

    position:absolute;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    width:90px;

    height:90px;

    z-index:10;

}

.base img{

    width:90px;

    height:90px;

    object-fit:contain;

}



/* Lugares de torres */

.slot{

    position:absolute;

    width:80px;

    height:80px;

    background:rgba(255,255,255,.25);

    border:3px dashed white;

    border-radius:15px;

}



/* Torre */

.tower{

    width:80px;

    height:80px;

    background:#dca55a;

    border:5px solid #5c3214;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:35px;

}

.tower img{

width:70px;

height:70px;

object-fit:contain;

}



/* Enemigo */

.enemy{

    position:absolute;

    width:55px;

    height:55px;

    background:#d83232;

    border:5px solid darkred;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

    z-index:5;

}

.enemy img{

    width:45px;

    height:45px;

    object-fit:contain;

    pointer-events:none;

    user-select:none;

}



/* Vida enemigo */

.enemy-hp{

    position:absolute;

    top:-15px;

    width:55px;

    height:8px;

    background:#222;

}


.enemy-hp-fill{

    height:100%;

    width:100%;

    background:red;

}



/* Tienda */

#shop{

    position:fixed;

    bottom:0;

    width:100%;

    background:#704214;

    padding:15px;

    display:none;

    text-align:center;

    z-index:30;

}


</style>

</head>

<body>

  <div class="hud">

<div class="box">
❤️ <span id="life">20</span>
</div>

<div class="box">
💰 <span id="money">150</span>
</div>

<div class="box">
🌊 <span id="wave">0</span>
</div>

<div class="box">
⏱️ <span id="timer">10</span>
</div>

<button onclick="openShop()">
Towers
</button>

<button onclick="deleteMode()">
Delete Tower
</button>

</div>



<div class="life-bar">
<div id="life-fill"></div>
</div>




<div class="game" id="game">


<div class="path"></div>


<div class="spawn">
<img src="https://i.postimg.cc/mkgcGdtF/Enemy-Base.png">
</div>


<div class="base">
<img src="https://i.postimg.cc/Jh3tHwXC/Survivor-Base.png">
</div>



<!-- Lugares de construcción -->

<div class="slot" style="left:38%;top:25%"></div>

<div class="slot" style="left:55%;top:25%"></div>

<div class="slot" style="left:38%;top:45%"></div>

<div class="slot" style="left:55%;top:45%"></div>

<div class="slot" style="left:38%;top:65%"></div>

<div class="slot" style="left:55%;top:65%"></div>


</div>




<div id="shop">

<h2 style="color:white">
Build Towers
</h2>


<button onclick="selectTower('https://i.postimg.cc/L5BfPb18/Rudy-Image.png',50,1,250)">
Rudy<br>
$50
</button>


<button onclick="selectTower('https://i.postimg.cc/qvYtNT5q/Chalo-Apps-Legacy-Image.png',200,2.5,350)">
ChaloApps<br>
$200
</button>


<button onclick="closeShop()">
Close
</button>


</div>


<audio id="shootSfx" src="./assets/BulletSFX.mp3" preload="auto"></audio>

<audio id="deathSfx" src="./assets/666herohero-monster-death-grunt-131480.mp3" preload="auto"></audio>

<audio id="baseHitSfx" src="./assets/coghezzi-game-over-orchestral-stinger-cartoon-defeat-546515.mp3" preload="auto"></audio>


<script>

const MAX_WAVES = 5;

let life = 20;

let money = 150;

let wave = 0;

let countdown = 10;

let selected = null;

let deleting = false;

let enemies = [];

let towers = [];

let runningWave = false;

function playSfx(id){

    const sound = document.getElementById(id);

    sound.currentTime = 0;

    sound.play();

}

function update(){


document.getElementById("life").innerHTML = life;

document.getElementById("money").innerHTML = money;

document.getElementById("wave").innerHTML = wave;

document.getElementById("life-fill").style.width =
(life * 5) + "%";


}




function openShop(){

document.getElementById("shop").style.display="block";

}



function closeShop(){

document.getElementById("shop").style.display="none";

}




function deleteMode(){

deleting=true;

selected=null;

}





function selectTower(icon,cost,damage,range){

if(money >= cost){

selected={

icon:icon,

cost:cost,

damage:damage,

range:range

};

closeShop();

}

}






document.querySelectorAll(".slot").forEach(slot=>{


slot.dataset.used="false";



slot.onclick=function(){



if(deleting){


let tower=this.querySelector(".tower");


if(tower){


tower.remove();


towers=towers.filter(
t=>t.element!==tower
);


this.dataset.used="false";


}


deleting=false;


return;


}





if(!selected)return;


if(this.dataset.used==="true")
return;



money-=selected.cost;



let tower=document.createElement("div");


tower.className="tower";

tower.innerHTML = `
<img src="${selected.icon}">
`;


this.appendChild(tower);



towers.push({

element:tower,

damage:selected.damage,

range:selected.range

});



this.dataset.used="true";


selected=null;


update();


};



});







function startTimer(){


let timer=setInterval(()=>{


countdown--;


document.getElementById("timer").innerHTML=countdown;



if(countdown<=0){


clearInterval(timer);


startWave();


}



},1000);


}






function startWave(){


wave++;

update();


let amount=wave*2;

let spawned=0;


let spawnTimer=setInterval(()=>{


spawnEnemy();


spawned++;


if(spawned>=amount){


clearInterval(spawnTimer);


waitNextWave();


}


},1500);


}






function waitNextWave(){

    if(wave >= MAX_WAVES){

        checkVictory();

        return;

    }

    countdown = 10;

    document.getElementById("timer").textContent = countdown;

    let timer = setInterval(()=>{

        countdown--;

        document.getElementById("timer").textContent = countdown;

        if(countdown <= 0){

            clearInterval(timer);

            startWave();

        }

    },1000);

    }



function checkVictory(){

    let check = setInterval(function(){

        if(enemies.length === 0){

            clearInterval(check);

            localStorage.setItem("inicioProgress", 2);

            alert("Level Completed!");

            location.href = "inicio.html";

        }

    }, 300);

    }


function spawnEnemy(){


let enemy=document.createElement("div");


enemy.className="enemy";


enemy.innerHTML = `
<img src="https://i.postimg.cc/KcCKW5mm/Meat-Chicken-Icon.png">
`;



let hp=document.createElement("div");

hp.className="enemy-hp";


let hpFill=document.createElement("div");

hpFill.className="enemy-hp-fill";


hp.appendChild(hpFill);


enemy.appendChild(hp);



game.appendChild(enemy);




let data={


element:enemy,

hpFill:hpFill,

y:10,

hp:10,

maxHp:10,

alive:true


};




enemies.push(data);



let movement=setInterval(()=>{


if(!data.alive){

clearInterval(movement);

return;

}



data.y+=0.25;


enemy.style.top=data.y+"%";

enemy.style.left="calc(50% - 27.5px)";




if(data.y>=85){


data.alive=false;


enemy.remove();


clearInterval(movement);



let index=enemies.indexOf(data);


if(index!=-1){

enemies.splice(index,1);

}


life--;


update();


}



},50);


}


function shoot(tower,target){

    let bullet=document.createElement("div");

    bullet.className="bullet";

    game.appendChild(bullet);

    playSfx("shootSfx");

    let x=tower.element.parentElement.offsetLeft+40;
    let y=tower.element.parentElement.offsetTop+40;

    bullet.style.left=x+"px";
    bullet.style.top=y+"px";

    let move=setInterval(()=>{

        if(!target.alive){

            bullet.remove();

            clearInterval(move);

            return;

        }

        let tx=target.element.offsetLeft+27;
        let ty=target.element.offsetTop+27;

        let dx=tx-x;
        let dy=ty-y;

        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<8){

            target.hp-=tower.damage;

            target.hpFill.style.width=(target.hp/target.maxHp*100)+"%";

            bullet.remove();

            clearInterval(move);

            if(target.hp<=0){

                playSfx("deathSfx");

                target.alive=false;

                target.element.remove();

                enemies.splice(enemies.indexOf(target),1);

                money+=25;

                update();

            }

            return;

        }

        x+=dx/dist*8;
        y+=dy/dist*8;

        bullet.style.left=x+"px";
        bullet.style.top=y+"px";

    },16);

}

function distance(tower,target){

let tx = tower.element.parentElement.offsetLeft + 40;
let ty = tower.element.parentElement.offsetTop + 40;

let ex = target.element.offsetLeft + 27;
let ey = target.element.offsetTop + 27;


let dx = ex - tx;
let dy = ey - ty;


return Math.sqrt(dx*dx + dy*dy);

}



setInterval(()=>{


towers.forEach(tower=>{


let target=enemies.find(e=>
    e.alive && distance(tower,e)<=tower.range
);


if(target){

    shoot(tower,target);

}

});


},700);







setInterval(()=>{

    if(life<=0){

        playSfx("baseHitSfx");

        setTimeout(()=>{

            alert("Defeat");

            location.reload();

        },300);

    }

},1000);





update();

startTimer();


</script>


</body>

</html>
